<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>ATR MODELFBX</title>
  <meta name="description" content="Convierte modelos 3D a FBX, OBJ o GLB, extrae sus texturas y optimízalos. Todo ocurre en tu navegador.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23ffffff' d='M12 2 3 7v10l9 5 9-5V7z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 7l9 5 9-5M12 12v10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>ATR MODELFBX</span>
    </div>
    <a class="gh-link" href="https://github.com/ATR-APPS/ATR-MODELFBX-APP" target="_blank" rel="noopener" title="Ver en GitHub" aria-label="Ver en GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <span id="gh-stars" class="gh-stars" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" d="M8 1.5l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.3l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>
        <span id="gh-count"></span>
      </span>
    </a>
  </header>

  <main>
    <section id="drop" class="dropbar">
      <input id="file" type="file" multiple accept=".glb,.gltf,.bin,.fbx,.obj,.mtl,.dae,.stl,.ply,.zip,.png,.jpg,.jpeg,.webp,.tga,.bmp,.tif,.tiff,.dds" hidden>
      <svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0-4 4m4-4 4 4M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="drop-title" class="drop-title">Arrastra tu modelo aquí</span>
      <span id="file-chip" class="file-chip" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M3 7l9 5 9-5M12 12v10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span id="fname" class="fname"></span>
      </span>
      <span id="formats" class="formats"><span>GLB</span><span>FBX</span><span>OBJ</span><span>DAE</span><span>STL</span><span>PLY</span><span>ZIP</span></span>
      <button id="pick" class="btn">Elegir archivos</button>
    </section>

    <section id="work" class="work">
      <div class="viewer-wrap">
        <canvas id="viewer"></canvas>
        <div id="empty" class="viewer-empty">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M3 7l9 5 9-5M12 12v10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <p>Tu modelo aparecerá aquí</p>
        </div>
        <div id="status" class="status" hidden></div>
        <div id="viewer-tools" class="viewer-tools" hidden>
          <label class="tool"><input id="wire" type="checkbox"> Ver malla</label>
          <button id="fit" class="tool" title="Centrar vista">Centrar</button>
        </div>
        <div id="viewer-info" class="viewer-info" hidden></div>
      </div>

      <aside class="panel">
        <div class="panel-scroll">
        <div id="panel-empty" class="panel-empty">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="16" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="18" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <p>Carga un modelo para ver sus datos, texturas y opciones de exportación</p>
        </div>
        <div id="panel-body" class="panel-body" hidden>
        <dl id="stats" class="stats"></dl>

        <section class="group">
          <h3 class="group-title">Modelo</h3>
          <label class="row">
            <span>Reducir polígonos</span>
            <input id="model-toggle" type="checkbox" class="switch">
          </label>
          <div id="model-yes" class="row-sub" hidden>
            <div class="slider-row">
              <input id="ratio" type="range" min="5" max="95" step="5" value="50" aria-label="Porcentaje de triángulos">
              <span id="ratio-val" class="ratio-val">50%</span>
            </div>
            <p id="model-result" class="result"></p>
          </div>
        </section>

        <section class="group">
          <h3 class="group-title">Texturas</h3>
          <label class="row">
            <span>Optimizar</span>
            <input id="tex-toggle" type="checkbox" class="switch" checked>
          </label>
          <div id="opt-yes" class="row-sub">
            <div class="row">
              <span>Tamaño máximo</span>
              <select id="size-sel">
                <option value="128">128 px</option>
                <option value="256">256 px</option>
                <option value="512" selected>512 px</option>
                <option value="1024">1024 px</option>
                <option value="2048">2048 px</option>
                <option value="exact">Exacto</option>
              </select>
            </div>
            <div id="exact-opts" class="row" hidden>
              <span>Ancho × alto</span>
              <span class="wh">
                <input id="exact-w" class="num" type="number" value="512" min="1" max="8192" step="1" aria-label="Ancho">
                <span class="muted">×</span>
                <input id="exact-h" class="num" type="number" value="512" min="1" max="8192" step="1" aria-label="Alto">
              </span>
            </div>
          </div>
        </section>

        <section class="group">
          <h3 class="group-title">Exportar</h3>
          <div class="seg" id="out-fmt" role="radiogroup">
            <button data-f="fbx" class="on">FBX</button>
            <button data-f="obj">OBJ</button>
            <button data-f="glb">GLB</button>
          </div>
          <div class="actions">
            <button id="dl-zip" class="btn primary">Descargar</button>
            <div class="actions-row">
              <button id="dl-model" class="btn">Solo FBX</button>
              <button id="dl-tex" class="btn">Solo texturas</button>
            </div>
          </div>
        </section>

        <ul id="warnings" class="warnings"></ul>

        <section class="group">
          <h3 class="group-title group-split"><span>Archivos de textura <span id="tex-count" class="count"></span></span><span id="tex-total" class="total"></span></h3>
        <div id="textures" class="textures"></div>
        </section>
        </div>
        </div>
      </aside>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
